name: API Checks

on:
  pull_request:
    paths:
      - 'api/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/checks-api.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.js'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/checks-api.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.js'

permissions:
  contents: read

jobs:
  api:
    name: Run API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm test:api
