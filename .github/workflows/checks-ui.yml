name: UI Checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'vite.config.js'
      - '.eslintrc.cjs'
      - '.github/workflows/checks-ui.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'vite.config.js'
      - '.eslintrc.cjs'
      - '.github/workflows/checks-ui.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  ui:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run UI tests
        run: pnpm test:ui

      - name: Build
        run: pnpm build
